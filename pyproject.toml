[project]
name = "ml-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "danivpv", email = "danivpv@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.260.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "pydantic-settings>=2.14.2",
]
inference-training = [
    "boto3>=1.38.27",
    "feast[aws]>=0.40.0",
    "mlflow-skinny>=3.14.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "s3fs>=2026.6.0",
    "scikit-learn>=1.9.0",
    "setuptools>=75.0.0",
    "skops>=0.10.0",
]
mlflow = [
    "boto3>=1.38.27",
    "mlflow[extras]>=3.14.0",
    "psycopg2-binary>=2.9.12",
    "setuptools>=75.0.0",
    "skops>=0.10.0",
]
dev = ["pytest>=9.1.1", "ruff>=0.15.20", "ty>=0.0.56"]
api = [
    "aioboto3>=13.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "bentoml>=1.3",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.14.2",
    "mlflow-skinny>=2.14.0",
]

[tool.ruff]
extend-exclude = ["**/alembic/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "infra" }, { group = "inference-training" }]]

[project.scripts]
ml-platform = "ml_platform:main"
ml-platform-train = "ml_platform.training.runtime.train:main"
ml-platform-predict = "ml_platform.inference.batch.runtime.predict:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
norecursedirs = ["cdk.out", ".venv", "dist", "build", "node_modules"]
testpaths = ["tests"]
